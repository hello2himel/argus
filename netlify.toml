# Netlify: the SAME Next.js UI as the full stack, exported static.
# Special rules for this mirror are compiled in at build time
# (NEXT_PUBLIC_STATIC_MODE=true): snapshot data instead of the API,
# no manual inspection, fixed viewer role, no review/site writes.
[build]
  base = "frontend"
  publish = "out"
  command = "npm ci && NEXT_STATIC_EXPORT=1 NEXT_PUBLIC_STATIC_MODE=true npm run build"

# Snapshot + previews are committed under frontend/public/data by
# `python3 scripts/export_static.py --real` (run before deploying).
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
